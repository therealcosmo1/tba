<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <link rel="stylesheet" href="styles/terminal.css">
</head>
<body>
  <section class="setup" id="setup" aria-labelledby="setup-title" hidden>
    <form class="setup-card" id="setup-form" autocomplete="off">
      <h1 id="setup-title"></h1>
      <div class="setup-intro" id="setup-intro"></div>
      <div class="setup-fields" id="setup-fields"></div>
      <p class="setup-error" id="setup-error" role="alert"></p>
      <button type="submit">Begin</button>
    </form>
  </section>

  <div class="app" id="app">
    <header class="status">
      <span class="status-room" id="status-room"></span>
      <span class="status-who" id="status-who"></span>
      <span class="status-turn" id="status-turn"></span>
    </header>

    <main class="layout">
      <section class="terminal" aria-label="Game">
        <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
        <form class="command" id="command" autocomplete="off">
          <label class="prompt" for="input">&gt;<span class="sr-only">Command</span></label>
          <input id="input" name="input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" autofocus>
        </form>
      </section>

      <aside class="side">
        <section class="panel" aria-labelledby="map-heading">
          <h2 id="map-heading">Map</h2>
          <svg class="map" id="map" role="group" aria-label="Map of the current room"></svg>
          <p class="map-caption" id="map-caption"></p>
        </section>
        <section class="panel" aria-labelledby="inv-heading">
          <h2 id="inv-heading">Inventory</h2>
          <ul class="inventory" id="inventory"></ul>
        </section>
      </aside>
    </main>
  </div>
  <script type="module" src="ui/main.js"></script>
</body>
</html>
